name: Run Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: "pnpm"
          node-version: "20.x"

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        shell: pwsh
        run: |
          & pnpm test 2>&1 | Tee-Object -FilePath test-output.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }
